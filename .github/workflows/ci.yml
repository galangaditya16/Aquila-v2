# Pemeriksaan cepat setiap push/PR: vet + test Go dan build frontend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang dependensi build (GTK4 + WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      # embed all:frontend/dist di desktop/main.go butuh hasil build frontend ada.
      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm install
      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build
      - name: Test frontend
        if: runner.os != 'Windows'
        working-directory: desktop/frontend
        run: npm test
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        working-directory: desktop/frontend
        run: |
          npm install
          npm run build
